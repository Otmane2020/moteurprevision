name: Deploy to Railway

on:
  push:
    branches:
      - "claude/prediction-engine-server-3wxvC"
      - main
  workflow_dispatch:

env:
  RAILWAY_TOKEN: abebc02d-47db-44fa-b2d0-f8bf5dc8323e

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Code ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Railway CLI ─────────────────────────────────────────────────────
      - name: Install Railway CLI v4
        run: |
          curl -fsSL \
            https://github.com/railwayapp/cli/releases/download/v4.36.1/railway-v4.36.1-x86_64-unknown-linux-gnu.tar.gz \
            -o /tmp/railway.tar.gz
          tar -xzf /tmp/railway.tar.gz -C /tmp
          mv /tmp/railway /usr/local/bin/railway
          chmod +x /usr/local/bin/railway
          railway --version

      # ── 3. Link or create project ──────────────────────────────────────────
      - name: Link or create Railway project
        run: |
          echo "=== Projects in account ==="
          railway list --json 2>&1 | tee /tmp/projects.json

          PROJECT_ID=$(python3 - <<'PYEOF'
          import json, sys
          try:
              with open('/tmp/projects.json') as f:
                  raw = f.read().strip()
              data = json.loads(raw)
              projects = data if isinstance(data, list) else data.get('projects', [])
              for p in projects:
                  if p.get('name') == 'moteurprevision':
                      pid = p.get('id') or p.get('projectId', '')
                      if pid:
                          print(pid)
                          break
          except Exception as e:
              print(f"parse error: {e}", file=sys.stderr)
          PYEOF
          )

          if [ -n "$PROJECT_ID" ]; then
            echo "Linking to existing project: $PROJECT_ID"
            railway link -p "$PROJECT_ID" -e production
          else
            echo "Creating new project: moteurprevision"
            railway init --name moteurprevision
          fi

          echo "=== Project config ==="
          cat .railway/project.json 2>/dev/null || echo "WARNING: no project.json found"

      # ── 4. Deploy API ──────────────────────────────────────────────────────
      - name: Deploy Python API
        run: |
          echo "=== Starting deployment ==="
          railway up --service moteurprevision
          echo "=== Deploy command completed ==="

      # ── 5. Add PostgreSQL ──────────────────────────────────────────────────
      - name: Add PostgreSQL database
        run: |
          railway add --database postgres \
            && echo "✅ PostgreSQL added" \
            || echo "ℹ️  PostgreSQL already exists or skipped"

      # ── 6. Add Redis ───────────────────────────────────────────────────────
      - name: Add Redis cache
        run: |
          railway add --database redis \
            && echo "✅ Redis added" \
            || echo "ℹ️  Redis already exists or skipped"

      # ── 7. Assign public domain ────────────────────────────────────────────
      - name: Assign public domain
        run: |
          railway domain 2>/dev/null && echo "✅ Domain assigned" || echo "ℹ️  Domain already assigned"

      # ── 8. Final status ────────────────────────────────────────────────────
      - name: Show final status
        run: |
          echo "=== Railway Status ==="
          railway status
          echo ""
          echo "=== Check logs at ==="
          echo "https://railway.app/dashboard"
