name: Deploy to Railway

on:
  push:
    branches:
      - "claude/prediction-engine-server-3wxvC"
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI v4
        run: |
          curl -fsSL \
            https://github.com/railwayapp/cli/releases/download/v4.36.1/railway-v4.36.1-x86_64-unknown-linux-gnu.tar.gz \
            -o /tmp/railway.tar.gz
          tar -xzf /tmp/railway.tar.gz -C /tmp
          mv /tmp/railway /usr/local/bin/railway
          chmod +x /usr/local/bin/railway
          railway --version

      - name: Link to Railway project
        env:
          RAILWAY_TOKEN: abebc02d-47db-44fa-b2d0-f8bf5dc8323e
        run: |
          set -e
          echo "Listing projects..."
          railway list --json 2>&1 | tee /tmp/projects.json

          PROJECT_ID=$(python3 -c "
import json, sys
try:
    data = json.loads(open('/tmp/projects.json').read().strip())
    projects = data if isinstance(data, list) else data.get('projects', [])
    for p in projects:
        pid = p.get('id') or p.get('projectId', '')
        if pid:
            print(pid, end='')
            break
except Exception as e:
    print('ERROR:' + str(e), file=sys.stderr)
" 2>/tmp/parse_err)

          echo "Project ID found: $PROJECT_ID"
          if [ -n "$PROJECT_ID" ]; then
            railway link -p "$PROJECT_ID" -e production
          else
            railway init --name moteurprevision
          fi
          cat .railway/project.json

      - name: Deploy API service
        env:
          RAILWAY_TOKEN: abebc02d-47db-44fa-b2d0-f8bf5dc8323e
        run: |
          railway up --service moteurprevision

      - name: Add PostgreSQL
        env:
          RAILWAY_TOKEN: abebc02d-47db-44fa-b2d0-f8bf5dc8323e
        run: railway add --database postgres || echo "already exists"

      - name: Add Redis
        env:
          RAILWAY_TOKEN: abebc02d-47db-44fa-b2d0-f8bf5dc8323e
        run: railway add --database redis || echo "already exists"

      - name: Assign domain
        env:
          RAILWAY_TOKEN: abebc02d-47db-44fa-b2d0-f8bf5dc8323e
        run: railway domain -s moteurprevision 2>/dev/null || true

      - name: Final status
        env:
          RAILWAY_TOKEN: abebc02d-47db-44fa-b2d0-f8bf5dc8323e
        run: railway status
