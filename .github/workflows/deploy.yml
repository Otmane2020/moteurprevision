name: Deploy to Railway

on:
  push:
    branches:
      - "claude/prediction-engine-server-3wxvC"
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy API service + add PostgreSQL + Redis
        env:
          RAILWAY_TOKEN: abebc02d-47db-44fa-b2d0-f8bf5dc8323e
        run: |
          # Deploy the main Python API service
          railway up --detach

          # Add PostgreSQL database service (idempotent)
          railway add --plugin postgresql --yes 2>/dev/null || echo "PostgreSQL already exists"

          # Add Redis cache service (idempotent)
          railway add --plugin redis --yes 2>/dev/null || echo "Redis already exists"

          echo "✅ All services deployed"
          railway status
