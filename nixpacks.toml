[phases.setup]
# Python 3.10 + build tools needed for statsmodels / lightgbm / xgboost
nixPkgs = [
  "python310",
  "python310Packages.pip",
  "gcc",
  "cmake",
  "pkg-config",
  "stdenv.cc.cc.lib",
  "libffi",
  "openssl",
  "zlib",
]

[phases.install]
cmds = [
  "pip install --upgrade pip",
  "pip install --no-cache-dir -r requirements.txt",
]

[start]
cmd = "uvicorn main:app --host 0.0.0.0 --port $PORT --workers 2"
